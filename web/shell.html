<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Ana Carvalho - Interactive Portfolio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (1366 / 768));
            max-height: calc(100vw * (768 / 1366));
        }

        canvas.emscripten {
            border: 0px none;
            background-color: black;
            width: 100%;
            height: 100%;
            display: block;
        }

        #video-container {
            display: none;
            position: absolute;
            z-index: 10;
            /* 72px left, 72px top in 1366x768 space */
            left: calc(100% * (72 / 1366));
            top: calc(100% * (72 / 768));
            /* Carousel images are approx 1222x624, let's make the video fill it */
            width: calc(100% * (1222 / 1366));
            height: calc(100% * (624 / 768));
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <div id="video-container">
            <iframe id="yt-iframe" width="100%" height="100%" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script type='text/javascript'>
        var Module = {
            canvas: (function () {
                var canvas = document.getElementById('canvas');

                canvas.width = 1366;
                canvas.height = 768;

                canvas.addEventListener("webglcontextlost", function (e) {
                    alert('WebGL context lost. Please reload the page.');
                    e.preventDefault();
                }, false);
                return canvas;
            })()
        };
    </script>

    {{{ SCRIPT }}}
</body>
</html>
